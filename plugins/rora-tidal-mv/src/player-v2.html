<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><style>html,body,#p{width:100%;height:100%;margin:0;background:#222}</style></head><body><div id="p"></div><script>
const q=new URLSearchParams(location.search),id=q.get("videoId"),channel=q.get("channel"),send=(type,data)=>parent.postMessage({app:"rora-tidal-mv",channel,type,data},"*");let player;
const fail=code=>{send("error",code);document.body.innerHTML=`<div style="box-sizing:border-box;padding:24px;color:#fff;font:16px sans-serif">YouTube player error ${code}. <a style="color:#66aaff" target="_blank" href="https://www.youtube.com/watch?v=${encodeURIComponent(id||"")}">Open on YouTube</a></div>`};
onYouTubeIframeAPIReady=()=>{const frame=document.createElement("iframe"),origin=location.origin;frame.title="YouTube music video";frame.allow="autoplay; encrypted-media; picture-in-picture";frame.allowFullscreen=true;frame.referrerPolicy="strict-origin-when-cross-origin";frame.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id||"")}?enablejsapi=1&autoplay=0&controls=1&playsinline=1&rel=0&origin=${encodeURIComponent(origin)}&widget_referrer=${encodeURIComponent(location.href)}`;document.getElementById("p").replaceChildren(frame);player=new YT.Player(frame,{events:{onReady:()=>send("ready",player.getAvailableQualityLevels?.()||[]),onError:e=>fail(e.data),onAutoplayBlocked:()=>send("autoplay-blocked")}})};
addEventListener("message",e=>{const m=e.data;if(m?.app!=="rora-tidal-mv"||m.channel!==channel||!player)return;m.type==="play"&&player.playVideo();m.type==="pause"&&player.pauseVideo();m.type==="volume"&&player.setVolume(Number(m.data));m.type==="quality"&&player.setPlaybackQuality?.(String(m.data))});
const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.append(s);
</script></body></html>
